apiVersion: v1
kind: Secret
metadata:
  name: yuhaul-oauth
  namespace: default
type: Opaque
stringData:
  # Values are provided in plain text here; Kubernetes encodes them as base64.
  # Replace every CHANGEME before applying.
  client-id: "CHANGEME-google-oauth-client-id"
  client-secret: "CHANGEME-google-oauth-client-secret"
  # Must match the Authorized redirect URI in Google Cloud Console exactly:
  # https://yuhaul.bateau.cloud/api/auth/callback
  redirect-url: "https://yuhaul.bateau.cloud/api/auth/callback"
  # 32-byte AES-256-GCM key, raw or base64. Generate with:
  #   openssl rand -base64 32
  encryption-key: "CHANGEME-encryption-key"
