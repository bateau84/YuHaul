apiVersion: apps/v1
kind: Deployment
metadata:
  name: yuhaul
  namespace: default
  labels:
    app: yuhaul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yuhaul
  template:
    metadata:
      labels:
        app: yuhaul
    spec:
      # Single-container deployment per architecture decision OQ-5.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: yuhaul
          image: yuhaul:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: YUHAUL_DB_PATH
              value: "/data/yuhaul.db"
            - name: YUHAUL_HTTP_ADDR
              value: ":8080"
            - name: YUHAUL_WEB_ROOT
              value: "/app/web"
            - name: YUHAUL_DAILY_QUOTA
              value: "10000"
            - name: YUHAUL_YOUTUBE_BASE_URL
              value: ""
            - name: YUHAUL_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: yuhaul-oauth
                  key: client-id
            - name: YUHAUL_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yuhaul-oauth
                  key: client-secret
            - name: YUHAUL_OAUTH_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: yuhaul-oauth
                  key: redirect-url
            - name: YUHAUL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: yuhaul-oauth
                  key: encryption-key
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/overview
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/overview
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yuhaul-data
