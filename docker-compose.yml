services:
  yuhaul:
    build: .
    container_name: yuhaul
    ports:
      - "8080:8080"
    environment:
      - YUHAUL_DB_PATH=/data/yuhaul.db
      - YUHAUL_HTTP_ADDR=:8080
      - YUHAUL_WEB_ROOT=/app/web
      - YUHAUL_DAILY_QUOTA=10000
      - YUHAUL_OAUTH_CLIENT_ID=${YUHAUL_OAUTH_CLIENT_ID}
      - YUHAUL_OAUTH_CLIENT_SECRET=${YUHAUL_OAUTH_CLIENT_SECRET}
      - YUHAUL_OAUTH_REDIRECT_URL=${YUHAUL_OAUTH_REDIRECT_URL}
      - YUHAUL_ENCRYPTION_KEY=${YUHAUL_ENCRYPTION_KEY}
    volumes:
      # Persistent SQLite database storage.
      - yuhaul-data:/data
      # Built admin SPA. Mount a directory containing index.html and assets.
      - ./web:/app/web:ro
    restart: unless-stopped

volumes:
  yuhaul-data:
